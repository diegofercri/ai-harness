name: enforce-dev-pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  enforce-dev-pr:
    name: enforce-dev-pr
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR policy
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [[ "$BASE_REF" != "dev" ]]; then
            printf 'PR base must be dev; received %s.\n' "$BASE_REF" >&2
            exit 1
          fi

          branch_pattern='^(feature|bugfix|chore|refactor)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$HEAD_REF" =~ $branch_pattern ]]; then
            printf 'Invalid branch name: %s\n' "$HEAD_REF" >&2
            exit 1
          fi

          require_match() {
            local description="$1"
            local pattern="$2"
            if [[ ! "$PR_BODY" =~ $pattern ]]; then
              printf 'PR body is missing a valid %s.\n' "$description" >&2
              exit 1
            fi
          }

          require_match 'work-item Issue reference' 'Work-item Issue:[[:space:]]*#[0-9]+'
          require_match 'work type' 'Work type:[[:space:]]*(feature|bugfix|chore|refactor)'
          require_match 'Hard Spec revision' 'Hard Spec:[[:space:]]*HS-[0-9]+'
          require_match 'Gherkin revision' 'Gherkin:[[:space:]]*GH-[0-9]+'
          require_match 'feature root' 'Feature root:[[:space:]]*`?[^[:space:]<]+'
          require_match 'run record' 'Run record:[[:space:]]*`?[^[:space:]<]+/runs/R[0-9]{3}\.md`?'
          require_match 'test evidence' 'Test evidence:[[:space:]]*[^<[:space:]]'
          require_match 'completed clean-code refactor checkbox' '\[[xX]\][[:space:]]+Final clean-code refactor completed, or approved N/A is linked'
          require_match 'PRE_MUTATION comment reference' 'PRE_MUTATION comment:[[:space:]]*https://[^[:space:]<>]+'
          require_match 'mutation comment reference' 'Mutation comment:[[:space:]]*https://[^[:space:]<>]+'
          require_match 'FINAL comment reference' 'FINAL comment:[[:space:]]*https://[^[:space:]<>]+'
          require_match 'exact candidate SHA' 'Exact SHA:[[:space:]]*`?[0-9a-fA-F]{40}`?'
          require_match 'dev base statement' '\[[xX]\][[:space:]]+The PR base is `dev`\.'

          if [[ "$PR_BODY" =~ Work-item[[:space:]]Issue:[[:space:]]*#([0-9]+) ]]; then
            issue_number="${BASH_REMATCH[1]}"
          else
            exit 1
          fi

          branch_issue="${HEAD_REF#*/}"
          branch_issue="${branch_issue%%-*}"
          if [[ "$branch_issue" != "$issue_number" ]]; then
            printf 'Branch Issue %s does not match PR work-item Issue %s.\n' "$branch_issue" "$issue_number" >&2
            exit 1
          fi

          if [[ "$PR_BODY" =~ Work[[:space:]]type:[[:space:]]*(feature|bugfix|chore|refactor) ]]; then
            work_type="${BASH_REMATCH[1]}"
          else
            exit 1
          fi
          branch_type="${HEAD_REF%%/*}"
          if [[ "$branch_type" != "$work_type" ]]; then
            printf 'Branch type %s does not match PR work type %s.\n' "$branch_type" "$work_type" >&2
            exit 1
          fi

          if [[ "$PR_BODY" =~ Exact[[:space:]]SHA:[[:space:]]*\`?([0-9a-fA-F]{40})\`? ]]; then
            declared_sha="${BASH_REMATCH[1],,}"
          else
            exit 1
          fi
          if [[ "$declared_sha" != "${HEAD_SHA,,}" ]]; then
            printf 'Declared SHA %s does not match PR head %s.\n' "$declared_sha" "$HEAD_SHA" >&2
            exit 1
          fi

          printf 'PR policy checks passed.\n'
