name: Work-item (atomic child, required)
description: One atomic delivery Issue with a human-owned spec and append-only specification comments.
title: "[work-item] "
labels: ["harness:work-item", "state:human-spec"]
body:
  - type: markdown
    attributes:
      value: |
        ## About this form

        This is an **atomic child work-item Issue**. It is the unit
        of work. It permits only one active branch and pull request.

        ### Sections this Issue will carry

        1. **Human Spec** - written by the human, owned by the human.
        2. **Hard Spec (HS-NNN)** - append-only comment by `SpecPartner`, approved by a human.
        3. **Gherkin (GH-NNN)** - append-only comment by `GherkinAuthor`, approved by a human.

        Approvals are **Issue comments**, not checkboxes. AI agents
        will never author an approval comment. Editing the Human
        Spec or publishing a new Hard Spec invalidates both approvals;
        publishing new Gherkin invalidates only the Gherkin approval.

        See `docs/issues.md`, `docs/gherkin.md`, and `docs/memory.md`
        in this repository for the full schema.
  - type: input
    id: slug
    attributes:
      label: Short slug
      description: Lowercase, hyphenated. Becomes part of `<type>/<id>-<slug>`.
      placeholder: export-report
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Work type
      description: Categorizes this work-item. The lead applies the matching `type:*` label before specification starts.
      options:
        - feature
        - bugfix
        - chore
        - refactor
    validations:
      required: true
  - type: input
    id: parent-request
    attributes:
      label: Parent request (optional)
      description: If this work-item belongs to a parent `harness:request` Issue, enter its number (e.g. `#123`).
      placeholder: "#42"
    validations:
      required: false
  - type: textarea
    id: relations
    attributes:
      label: Related Issues
      description: Other Issues this one blocks or is blocked by, one per line (e.g. `blocks #45`, `blocked-by #44`).
      placeholder: |
        blocked-by #44
        blocks    #50
    validations:
      required: false
  - type: textarea
    id: human-spec
    attributes:
      label: Human Spec (human-owned, verbatim)
      description: |
        Write the problem, intent, and acceptance in your own words.
        This text is yours. The AI will not reword, refactor, or
        "improve" it. Editing this section later invalidates both
        the Hard Spec and Gherkin approvals, by design.
      placeholder: |
        I want users to export the current report in a portable format.
        Empty reports must still produce a valid export.
        Exporting must not change stored data.
    validations:
      required: true
  - type: input
    id: feature-root
    attributes:
      label: Proposed feature root (optional)
      description: |
        If you have a strong opinion, propose one repo-relative path
        for this work-item (e.g. `packages/reporting`). `SpecPartner` will
        confirm or propose an alternative during Hard Spec review.
        One feature root per work-item, even for cross-cutting work.
      placeholder: packages/reporting
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: |
        Links, screenshots, related discussions, anything that helps
        `SpecPartner` and `GherkinAuthor`. Not a substitute for
        the Human Spec above.
    validations:
      required: false
